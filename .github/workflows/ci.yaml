name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 0 * * *'

jobs:
  ci:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        dart: [stable, dev]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.dart == 'dev' && 'master' || matrix.dart }}
          cache: true
      - run: dart pub global activate melos
      - run: dart pub global activate daco
      - run: melos bootstrap
      - run: melos format:check
      - run: melos analyze
      - run: melos test

  source-launch:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Keep the first affected SDK pinned: Flutter master does not always
        # ship the Dart dev release that changed Platform.script.
        sdk: ['3.8.0', '3.14.0-281.0.dev', dev]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test test/source_launch_test.dart -j 1
